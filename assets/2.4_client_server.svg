<text x="529" y="111" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" fill="#666666">SSH 隧道</text>

<text x="540" y="252" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#666666">隧道的作用：vLLM 只监听回环地址，外网连不进来，SSH 把本地 8001 的请求送到服务器的 127.0.0.1:8000</text>
<text x="540" y="288" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#666666">sshd 会话进程：登录时由 sshd fork 出来，不监听端口，只负责替你去连 8000</text>
